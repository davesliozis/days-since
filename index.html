const data=JSON.parse(document.getElementById('source-data').textContent);
function today(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}`}
function display(d){return d.slice(5,7)+'/'+d.slice(8,10)+'/'+d.slice(0,4)}
function days(r,t){return r.total??Math.round((Date.parse((r.end||t)+'T00:00:00Z')-Date.parse(r.start+'T00:00:00Z'))/86400000)}
function row(r,label,t){const tr=document.createElement('tr');tr.className=r.end?'':'ongoing';for(const v of [label,display(r.start),display(r.end||t)+(r.end?'':' · today'),days(r,t)]){const td=document.createElement('td');td.textContent=v;tr.append(td)}return tr}
function render(){const t=today();document.getElementById('asof').textContent='As of '+display(t)+' · Pacific Time';const dates=document.getElementById('dates'),fame=document.getElementById('fame');dates.replaceChildren();fame.replaceChildren();data.records.forEach(r=>dates.append(row(r,r.id,t)));data.records.filter(r=>r.end).sort((a,b)=>days(b,t)-days(a,t)).forEach((r,i)=>fame.append(row(r,i+1,t)));data.specials.forEach((r,i)=>{const tr=row(r,r.label,t);tr.className='special';fame.append(tr)})}render();setInterval(render,60000);
